# Monthly update PRs for Python packages and GitHub Actions; each runs CI
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # requirements.txt pins minimums (>=), which already allow the newest
    # release; only open a PR when a release falls outside that range
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
